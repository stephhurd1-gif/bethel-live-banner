<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bethel Live Banner</title>

  <style>
    :root{
      --h-desktop: 84px;
      --h-mobile: 96px;

      --black: #01060b;
      --gold:  #f7bf5b;
      --purple:#86239c;
      --green: #429e40;
      --white: #fffefe;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100%;
      background: transparent;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    .banner {
      position: relative;
      top: 0;
      left: 0;
      width: 100%;
      max-width: 100%;
      height: var(--h-desktop);
      padding: 10px 14px;
      display: none;
      z-index: 1;
      color: var(--white);
      overflow: hidden;
      transform: translateY(-16px);
      opacity: 0;
      transition: transform 520ms ease, opacity 520ms ease;
      box-shadow: 0 10px 22px rgba(0,0,0,0.35);
    }

    .banner.is-visible {
      transform: translateY(0);
      opacity: 1;
    }

    .bannerInner {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      z-index: 2;
      max-width: 100%;
    }

    a.bannerLink {
      color: var(--white);
      text-decoration: none;
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      line-height: 1.12;
      border-radius: 999px;
      padding: 10px 18px;
      cursor: pointer;
      overflow: hidden;
    }

    .titleRow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 900;
      letter-spacing: 0.2px;
      font-size: 22px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 100%;
      flex-wrap: wrap;
    }

    .subRow {
      font-size: 14px;
      font-weight: 700;
      opacity: 0.95;
      text-shadow: 0 2px 10px rgba(0,0,0,0.20);
    }

    .liveBadge {
      background: linear-gradient(180deg, #fff1c9, var(--gold));
      color: #2b1b05;
      font-size: 12px;
      font-weight: 900;
      padding: 6px 12px;
      border-radius: 999px;
      letter-spacing: 0.9px;
      box-shadow: 0 6px 16px rgba(1,6,11,0.35);
      position: relative;
      overflow: hidden;
      white-space: nowrap;
    }

    .liveBadge::after {
      content: "";
      position: absolute;
      top: -30%;
      left: -40%;
      width: 60%;
      height: 180%;
      background: rgba(255,255,255,0.35);
      transform: rotate(22deg);
      animation: badgeShine 2.2s ease-in-out infinite;
    }

    @keyframes badgeShine {
      0% { left: -60%; opacity: 0; }
      30% { opacity: 0.45; }
      60% { opacity: 0.15; }
      100% { left: 140%; opacity: 0; }
    }

    .banner.live {
      background: linear-gradient(
        270deg,
        var(--purple),
        #6f1f85,
        var(--gold),
        var(--purple)
      );
      background-size: 600% 600%;
      animation: gradientMove 9s ease infinite;
      box-shadow:
        0 0 28px rgba(134,35,156,0.60),
        0 10px 22px rgba(1,6,11,0.45);
    }

    .banner.live::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-conic-gradient(
          from 0deg,
          rgba(247,191,91,0.08) 0deg 10deg,
          rgba(1,6,11,0) 10deg 20deg
        );
      opacity: 0.55;
      pointer-events: none;
      z-index: 1;
    }

    .banner.live a.bannerLink {
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(247,191,91,0.80);
      box-shadow:
        0 0 0 1px rgba(247,191,91,0.18) inset,
        0 14px 30px rgba(1,6,11,0.25);
    }

    .banner.offline {
      background: linear-gradient(
        270deg,
        var(--black),
        #06121a,
        var(--black)
      );
      background-size: 600% 600%;
      animation: gradientMove 14s ease infinite;
      box-shadow: 0 10px 22px rgba(1,6,11,0.65);
    }

    .banner.offline a.bannerLink {
      background: rgba(247,191,91,0.12);
      border: 1px solid rgba(247,191,91,0.60);
      box-shadow:
        0 0 0 1px rgba(247,191,91,0.20) inset,
        0 12px 26px rgba(1,6,11,0.35);
    }

    @keyframes gradientMove {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @media (max-width: 520px){
      .banner { height: var(--h-mobile); padding: 10px 10px; }
      a.bannerLink { border-radius: 22px; padding: 10px 14px; }
      .titleRow { font-size: 18px; gap: 8px; }
      .subRow { font-size: 13px; }
    }
  </style>
</head>

<body>
  <div id="banner" class="banner">
    <div class="bannerInner">
      <a id="link" class="bannerLink" href="#" target="_top" rel="noopener">
        <span id="title" class="titleRow"></span>
        <span id="sub" class="subRow"></span>
      </a>
    </div>
  </div>

  <script>
    (function () {
      const API_KEY = "AIzaSyAUjf8QLzCafhgxSI8LN7e116-VZgcw4kg";
      const CHANNEL_ID = "UCvFyu7ybvACGGblAZxuE93g";
      const SERVICE_DAY = 0;
      const SERVICE_HOUR = 9;
      const SERVICE_MINUTE = 30;
      const WATCH_LIVE_PAGE = "https://bethelamelancaster.com/watch-live";

      const POLL_FAST_MS = 60000;
      const POLL_SLOW_MS = 10 * 60 * 1000;

      function isServiceWindow() {
        const now = new Date();
        const day = now.getDay();
        const hr = now.getHours();
        return day === 0 && hr >= 8 && hr <= 13;
      }

      function getServiceStatus() {
        const now = new Date();

        const service = new Date();
        service.setDate(now.getDate());
        service.setHours(SERVICE_HOUR);
        service.setMinutes(SERVICE_MINUTE);
        service.setSeconds(0);
        service.setMilliseconds(0);

        const diff = service - now;

        if (now.getDay() !== SERVICE_DAY) return "normal";
        if (diff > 10 * 60 * 1000) return "before";
        if (diff > 0) return "startingSoon";
        return "during";
      }

      const banner = document.getElementById("banner");
      const link = document.getElementById("link");
      const title = document.getElementById("title");
      const sub = document.getElementById("sub");

      const params = new URLSearchParams(window.location.search);

      if (params.get("forceLive") === "1") {
        localStorage.setItem("bethelForceState", "live");
      } else if (params.get("forceOffline") === "1") {
        localStorage.setItem("bethelForceState", "offline");
      } else if (params.get("forceLive") === "0" || params.get("forceOffline") === "0") {
        localStorage.removeItem("bethelForceState");
      }

      function getForcedState() {
        return localStorage.getItem("bethelForceState");
      }

      function reveal() {
        banner.style.display = "block";
        requestAnimationFrame(() => banner.classList.add("is-visible"));
      }

      function setState(state) {
        banner.classList.remove("live", "offline");
        banner.classList.add(state);

        link.href = WATCH_LIVE_PAGE;

        const status = getServiceStatus();

        if (state === "live") {
          title.innerHTML = '<span class="liveBadge">LIVE</span> Watch Live Now';
          sub.textContent = "Join us Sundays at 9:30 AM • Worship with us online";
        } else {
          if (status === "startingSoon") {
            title.textContent = "⏳ Service Starting Soon";
            sub.textContent = "Live worship begins at 9:30 AM";
          } else if (status === "before") {
            title.textContent = "⛪ Sunday Worship at 9:30 AM";
            sub.textContent = "Join us live or watch the replay anytime";
          } else {
            title.textContent = "✨ Watch the Latest Service Replay";
            sub.textContent = "Join us Sundays at 9:30 AM • All Are Welcome";
          }
        }

        reveal();
      }

      async function checkLiveOnce() {
        const forced = getForcedState();
        if (forced === "live") {
          setState("live");
          return;
        }
        if (forced === "offline") {
          setState("offline");
          return;
        }

        if (!API_KEY) {
          setState("offline");
          return;
        }

        try {
          const url =
            "https://www.googleapis.com/youtube/v3/search" +
            "?part=snippet" +
            "&channelId=" + encodeURIComponent(CHANNEL_ID) +
            "&eventType=live" +
            "&type=video" +
            "&maxResults=1" +
            "&key=" + encodeURIComponent(API_KEY);

          const res = await fetch(url, { cache: "no-store" });

          if (!res.ok) {
            setState("offline");
            return;
          }

          const data = await res.json();
          const item = data.items && data.items[0];

          if (item && item.id && item.id.videoId) {
            setState("live");
          } else {
            setState("offline");
          }
        } catch (e) {
          console.log("Live check failed");
          setState("offline");
        }
      }

      checkLiveOnce();

      let pollTimer = null;
      function startPolling() {
        if (pollTimer) clearInterval(pollTimer);
        const interval = isServiceWindow() ? POLL_FAST_MS : POLL_SLOW_MS;
        pollTimer = setInterval(checkLiveOnce, interval);
      }

      startPolling();
      setInterval(startPolling, 15 * 60 * 1000);
    })();
  </script>
</body>
</html>
